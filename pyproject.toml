[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-url-scraper"
version = "1.0.0"
description = "Google Maps URL scraper - pure HTTP, production grade (place URLs & business websites)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["curl_cffi>=0.16"]

[tool.setuptools]
packages = ["maps_url_scraper"]
